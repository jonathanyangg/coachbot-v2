# Flat key=value. This is not YAML. '#' starts a comment.
# BCM numbers confirmed on bottom_board_v2.sch (TB6612FNG TB1) and
# coachbots/cocos src/config.rs. Both motors share STBY.
#
# Left  AIN1=GPIO19 AIN2=GPIO16 PWMA=GPIO26
# Right BIN1=GPIO5  BIN2=GPIO6  PWMB=GPIO12
# STBY  GPIO20
# LED connector SV1: GPIO22, GPIO23, GPIO24 as v1 R, G, B.
# The schematic does not label colors. GPIO22 is also switch S2.
# User button S1: GPIO27.

endpoint=ipc:///tmp/cocos-api
id=-1
virtual_id=-1

# auto: libgpiod when gpiochip exists, otherwise the in-memory backend.
# Tests and a dry run on a Pi set gpio=memory. gpio=pi fails if the chip cannot be opened.
gpio=auto
gpiochip=/dev/gpiochip0

left_in1=19
left_in2=16
left_pwm=26
left_stdby=20
right_in1=5
right_in2=6
right_pwm=12
right_stdby=20

led_r=22
led_g=23
led_b=24

# User button S1: GPIO27 to 3.3V when pressed (bottom_board_v2.sch).
# Read active-high with the internal pull-down. -1 disables isButtonPressed.
button_pin=27

# v1 defaults: motor 600 Hz (src/drivers/motor_driver.rs), LED 120 Hz (src/config.rs).
motor_hz=600
led_hz=120

# 64 bytes: published user-guide cap. Not a radio frame.
msg_max_bytes=64
msg_max_count=32
